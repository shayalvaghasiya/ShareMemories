name: CI/CD Pipeline

on:
  push:
    # Trigger this workflow ONLY when pushing to the new AWS branch
    branches: [ "feature/aws-deployment" ]
  workflow_dispatch: # Allows you to trigger the deployment manually from the GitHub UI

env:
  REGISTRY: ghcr.io
  # github.repository is usually "username/reponame"
  IMAGE_NAME: ${{ github.repository }}
  # Replace with your actual AWS region and ECR repository names
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend/Worker Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/sharememories-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/sharememories-backend:${{ github.sha }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-aws.sharememories.app
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/sharememories-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/sharememories-frontend:${{ github.sha }}

  deploy-aws-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to Amazon ECS
        run: |
          echo "Forcing ECS to pull the new images and restart..."
          aws ecs update-service --cluster sharememories-cluster --service frontend-service --force-new-deployment
          aws ecs update-service --cluster sharememories-cluster --service backend-service --force-new-deployment
          aws ecs update-service --cluster sharememories-cluster --service worker-service --force-new-deployment